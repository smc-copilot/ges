[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ges"
version = "6.0.0-alpha.5"
description = "GES 6 Composer + Governance Backplane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
ges = "ges.cli.main:main"

[project.urls]
Homepage = "https://github.com/smc-copilot/ges"
Source = "https://github.com/smc-copilot/ges"
Upstream = "https://github.com/smc-copilot/governance-engineering"

[tool.setuptools.packages.find]
include = ["ges*"]

[tool.setuptools.package-data]
ges = ["schemas/*.json", "catalog/*.yaml", "catalog/profiles/*.yaml", "legacy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
